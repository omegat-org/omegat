steps:
  - task: Bash@3
    displayName: 'Download JRE'
    inputs:
      targetType: 'inline'
      script: |
        set -euo pipefail
        props="$(Build.SourcesDirectory)/gradle.properties"
        read_prop() { awk -F= -v k="$1" '$1==k{sub(/^[^=]*=/,""); print; exit}' "$props"; }
        mkdir -p "$(System.ArtifactsDirectory)/asset"
        cd "$(System.ArtifactsDirectory)/asset"
        jres=(
          "$(read_prop org.omegat.jre.windows.x64.url)"
          "$(read_prop org.omegat.jre.windows.aarch64.url)"
          "$(read_prop org.omegat.jre.linux.x64.url)"
          "$(read_prop org.omegat.jre.linux.aarch64.url)"
        )
        for url in "${jres[@]}"; do
          [ -n "$url" ] || { echo "##vso[task.logissue type=error]Missing JRE URL in gradle.properties"; exit 1; }
          file="$(basename "$url")"
          curl -fL "$url" -o "$file"
          case "$file" in
            *.zip)    unzip -tq "$file" || { echo "##vso[task.logissue type=error]Invalid zip: $file";  exit 1; } ;;
            *.tar.gz) gzip  -t  "$file" || { echo "##vso[task.logissue type=error]Invalid gzip: $file"; exit 1; } ;;
          esac
        done
  - task: Cache@2
    displayName: 'Cache Gradle'
    inputs:
      key: 'gradle | "$(Agent.OS)" | gradle/wrapper/gradle-wrapper.properties | settings.gradle | **/build.gradle'
      restoreKeys: |
        gradle | "$(Agent.OS)"
        gradle
      path: '$(GRADLE_USER_HOME)'
  - task: Gradle@3
    inputs:
      tasks: 'clean javadoc manualHtmls'
      options: '--build-cache -PenvIsCi'
      jdkVersionOption: '1.21'
    displayName: 'Build docs'
  - task: Gradle@3
    inputs:
      tasks: 'sourceDistZip distZip mac win linux64DistTarBz linuxArm64DistTarBz'
      options: '--build-cache -PenvIsCi --scan -PassetDir=$(System.ArtifactsDirectory)/asset'
      jdkVersionOption: '1.21'
    displayName: 'Build distribution packages'
