# OmegaT distribution package meta data.
org.omegat.appName=OmegaT
org.omegat.artifactId=omegat
org.omegat.groupId=org.omegat
org.omegat.mainClassName=org.omegat.Main
org.omegat.shortDescription=The free translation memory tool
org.omegat.distDescription=OmegaT is a free and open source multiplatform Computer Assisted Translation tool with fuzzy matching, translation memory, keyword search, glossaries, and translation leveraging into updated projects.
org.omegat.vendor=The OmegaT project
org.omegat.url=https://omegat.org
org.omegat.developer.email=info@omegat.org
org.omegat.developer.name=OmegaT Developers

# Don't include extra stuff like version number in JAR name
org.omegat.omegatJarFilename=OmegaT.jar
org.omegat.manualLangs=ca,en,fr,it,ja,nl
org.omegat.firstStepLangs=ca,co,de,en,fr,ia,it,ja,nl,pt_BR,zh_CN

# mac-specific
org.omegat.mac.jvmRequired=21+

# --- Bundled JRE definitions -------------------------------------------------
# `.file` = archive filename pattern the build matches inside assetDir.
# `.url`  = download source CI fetches into assetDir (macOS is not fetched by CI).
# Bump versions by editing `.url` (and `.file` only when the OpenJDKxxU major changes).
# Windows/aarch64 uses Temurin 21 (no Temurin 25 Windows-ARM build yet).
org.omegat.jre.windows.x64.url=https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.3%2B9/OpenJDK25U-jre_x64_windows_hotspot_25.0.3_9.zip
org.omegat.jre.windows.x64.file=OpenJDK25U-jre_x64_windows_*.zip
org.omegat.jre.windows.aarch64.url=https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.9%2B10/OpenJDK21U-jre_aarch64_windows_hotspot_21.0.9_10.zip
org.omegat.jre.windows.aarch64.file=OpenJDK21U-jre_aarch64_windows_*.zip
org.omegat.jre.linux.x64.url=https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.3%2B9/OpenJDK25U-jre_x64_linux_hotspot_25.0.3_9.tar.gz
org.omegat.jre.linux.x64.file=OpenJDK25U-jre_x64_linux_*.tar.gz
org.omegat.jre.linux.aarch64.url=https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.3%2B9/OpenJDK25U-jre_aarch64_linux_hotspot_25.0.3_9.tar.gz
org.omegat.jre.linux.aarch64.file=OpenJDK25U-jre_aarch64_linux_*.tar.gz
org.omegat.jre.mac.x64.file=OpenJDK25U-jre_x64_mac_*.tar.gz
org.omegat.jre.mac.aarch64.file=OpenJDK25U-jre_aarch64_mac_*.tar.gz

# JVM settings for run and test tasks
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
runMaxHeapSize=1024M
testMaxHeapSize=2048M

# Gradle settings
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=true
org.gradle.parallel=true
