plugins {
    id 'org.omegat.module'
}

def providedCoreLibsDir = omegatModule.providedCoreLibsDir

dependencies {
    compileOnly(project(':'))
    if (file(providedCoreLibsDir).directory) {
        compileOnly omegatModule.providedCoreLib('jspecify', 'languagetool-core', 'commons-io')
        implementation omegatModule.providedModuleLib('language-ca')
        runtimeOnly omegatModule.providedModuleLib('catalan-pos-dict')
    } else {
        compileOnly(libs.commons.io)
        compileOnly(libs.jspecify)
        compileOnly(libs.languagetool.core)
        implementation(libs.languagetool.ca) {
            exclude module: 'languagetool-core'
        }
        compileOnly(libs.lucene.analyzers.common)
    }
    testImplementation(libs.junit4)
    testImplementation(libs.assertj.core)
    testImplementation(testFixtures(project(':')))
    testImplementation(project(":spellchecker:lucene"))
    testImplementation(libs.languagetool.core)
    testRuntimeOnly(libs.commons.io)
}

test {
    dependsOn tasks.withType(Jar)
    dependsOn project(":spellchecker:lucene").tasks.withType(Jar)
}
