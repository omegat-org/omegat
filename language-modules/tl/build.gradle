plugins {
    id 'org.omegat.module'
}

def providedCoreLibsDir = rootProject.property('providedCoreLibsDir')

dependencies {
    compileOnly(project(':'))
    if (file(providedCoreLibsDir).directory) {
        compileOnly fileTree(dir: providedCoreLibsDir,
                includes: ['**/jspecify-*.jar', '**/languagetool-core-*.jar', '**/commons-io-*.jar', '**/morfologik-stemming-*.jar', '**/jspecify-*.jar'])
        implementation fileTree(dir: providedModuleLibsDir, includes: ['**/language-tl-*.jar'])
    } else {
        compileOnly(libs.commons.io)
        compileOnly(libs.jspecify)
        compileOnly(libs.languagetool.core)
        implementation(libs.languagetool.tl) {
            exclude module: 'languagetool-core'
        }
        compileOnly(libs.morfologik.stemming)
        compileOnly(libs.jspecify)
    }
    testImplementation(libs.junit4)
    testImplementation(libs.assertj.core)
    testImplementation(testFixtures(project(':')))
    testImplementation(libs.commons.io)
    testImplementation(libs.languagetool.core)
    testImplementation project(":spellchecker:morfologik")
}

test {
    dependsOn tasks.withType(Jar)
    dependsOn project(":spellchecker:morfologik").tasks.withType(Jar)
}
