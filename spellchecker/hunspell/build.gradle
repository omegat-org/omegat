plugins {
    id 'org.omegat.module'
}

def providedCoreLibsDir = omegatModule.providedCoreLibsDir

dependencies {
    compileOnly(project(':'))
    if (file(providedCoreLibsDir).directory) {
        implementation omegatModule.providedModuleLib('hunspell')
        compileOnly omegatModule.providedCoreLib('languagetool-core', 'commons-io', 'lib-mnemonics',
                'slf4j-format-jdk14', 'lucene-analysis-common', 'jspecify')
    } else {
        implementation(libs.dumont.hunspell)
        compileOnly(libs.commons.io)
        compileOnly(libs.omegat.mnemonics)
        compileOnly(libs.slf4j.format.jdk14)
        compileOnly(libs.languagetool.core)
        compileOnly(libs.lucene.analyzers.common)
        compileOnly(libs.jspecify)
    }
    testImplementation(libs.junit4)
    testImplementation(libs.assertj.core)
    testImplementation(testFixtures(project(':'))) {
        exclude module: 'wiremock'
    }
    testImplementation(libs.languagetool.core)
    testImplementation(libs.commons.io)
    testImplementation(libs.languagetool.de)
}

test {
    dependsOn project(':language-modules:de').tasks.withType(Jar)
    dependsOn project(':language-modules:fr').tasks.withType(Jar)
}
