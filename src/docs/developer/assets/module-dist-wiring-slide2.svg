font-weight="bold" text-anchor="start">43 leaf subprojects (producers)</text><text x="36" y="142" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5f6b71" font-weight="normal" text-anchor="start">theme, tipoftheday, aligner, firsttime-wizard,</text><text x="36" y="159" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5f6b71" font-weight="normal" text-anchor="start">6x machinetranslators, 30x language-modules,</text><text x="36" y="176" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5f6b71" font-weight="normal" text-anchor="start">3x spellchecker</text><rect x="36" y="202" width="326" height="190" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="1.2"/><text x="48" y="224" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1565c0" font-weight="bold" text-anchor="start">OmegatModulePlugin (build-logic)</text><text x="48" y="242" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5f6b71" font-weight="normal" text-anchor="start">plugin id: org.omegat.module</text><text x="48" y="266" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e282c" font-weight="normal" text-anchor="start">NEW consumable configuration:</text><text x="48" y="286" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1565c0" font-weight="bold" text-anchor="start">moduleJarElements</text><text x="48" y="308" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e282c" font-weight="normal" text-anchor="start">artifact = the module fat jar</text><text x="48" y="325" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e282c" font-weight="normal" text-anchor="start">(output of jar, which merges the</text><text x="48" y="342" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e282c" font-weight="normal" text-anchor="start">module's runtimeClasspath)</text><text x="48" y="359" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e282c" font-weight="normal" text-anchor="start">canBeConsumed = true</text><text x="48" y="376" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e282c" font-weight="normal" text-anchor="start">canBeResolved = false</text><text x="36" y="416" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5f6b71" font-weight="normal" text-anchor="start">Unchanged: moduleRuntimeDependencies</text><text x="36" y="433" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5f6b71" font-weight="normal" text-anchor="start">(consumable, feeds the source dist libs),</text><text x="36" y="450" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5f6b71" font-weight="normal" text-anchor="start">jar task, tests, quality checks.</text><rect x="424" y="96" width="366" height="420" rx="8" fill="#ffffff" stroke="#1e282c" stroke-width="1.2"/><text x="436" y="120" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e282c" font-weight="bold" text-anchor="start">Root project build.gradle</text><rect x="436" y="136" width="342" height="128" rx="8" fill="#f2f7fd" stroke="#1565c0" stroke-width="1.2"/><text x="448" y="158" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e282c" font-weight="normal" text-anchor="start">NEW resolvable configuration:</text><text x="448" y="178" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1565c0" font-weight="bold" text-anchor="start">moduleDist</text><text x="448" y="198" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e282c" font-weight="normal" text-anchor="start">canBeConsumed = false</text><text x="448" y="215" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e282c" font-weight="normal" text-anchor="start">transitive = false</text><text x="448" y="232" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e282c" font-weight="normal" text-anchor="start">one project dependency per leaf:</text><rect x="436" y="276" width="342" height="76" rx="8" fill="#eef1f3" stroke="#5f6b71" stroke-width="1.2"/><text x="448" y="298" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1e282c" font-weight="normal" text-anchor="start">moduleDist(project(sub.path)) {</text><text x="448" y="315" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1e282c" font-weight="normal" text-anchor="start">  targetConfiguration =</text><text x="448" y="332" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1e282c" font-weight="normal" text-anchor="start">      'moduleJarElements' }</text><text x="436" y="380" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e282c" font-weight="normal" text-anchor="start">A declared project dependency is the</text><text x="436" y="397" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e282c" font-weight="normal" text-anchor="start">supported coupling: configure-on-demand</text><text x="436" y="414" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e282c" font-weight="normal" text-anchor="start">configures the target projects when the</text><text x="436" y="431" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e282c" font-weight="normal" text-anchor="start">configuration is resolved, and the file</text><text x="436" y="448" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e282c" font-weight="normal" text-anchor="start">collection carries the jar task</text><text x="436" y="465" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e282c" font-weight="normal" text-anchor="start">dependencies for every consumer.</text><text x="436" y="482" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e282c" font-weight="normal" text-anchor="start"></text><text x="436" y="499" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e282c" font-weight="normal" text-anchor="start">moduleRuntimeLibs is now declared</text><text x="436" y="516" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e282c" font-weight="normal" text-anchor="start">unconditionally for the same reason.</text><text x="852" y="110" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e282c" font-weight="bold" text-anchor="start">Consumers (all were affected)</text><rect x="840" y="122" width="336" height="92" rx="8" fill="#ffffff" stroke="#5f6b71" stroke-width="1.2"/><text x="852" y="142" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e282c" font-weight="bold" text-anchor="start">distributions.main</text><text x="852" y="162" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#1565c0" font-weight="normal" text-anchor="start">into('modules') {</text><text x="852" y="179" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#1565c0" font-weight="normal" text-anchor="start">    from(configurations.moduleDist) }</text><text x="852" y="198" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b71" font-weight="normal" text-anchor="start">installDist, distZip, mac/win/linux dists</text><rect x="840" y="226" width="336" height="75" rx="8" fill="#ffffff" stroke="#5f6b71" stroke-width="1.2"/><text x="852" y="246" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e282c" font-weight="bold" text-anchor="start">test (root)</text><text x="852" y="266" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#1565c0" font-weight="normal" text-anchor="start">dependsOn configurations.moduleDist</text><text x="852" y="285" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b71" font-weight="normal" text-anchor="start">module jars present for core tests</text><rect x="840" y="313" width="336" height="75" rx="8" fill="#ffffff" stroke="#5f6b71" stroke-width="1.2"/><text x="852" y="333" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e282c" font-weight="bold" text-anchor="start">run / runDebugger / testIntegration</text><text x="852" y="353" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#1565c0" font-weight="normal" text-anchor="start">dependsOn configurations.moduleDist</text><text x="852" y="372" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b71" font-weight="normal" text-anchor="start">verification-conventions.gradle</text><rect x="840" y="400" width="336" height="75" rx="8" fill="#ffffff" stroke="#5f6b71" stroke-width="1.2"/><text x="852" y="420" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e282c" font-weight="bold" text-anchor="start">jpackageAppContentModules</text><text x="852" y="440" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#1565c0" font-weight="normal" text-anchor="start">dependsOn configurations.moduleDist</text><text x="852" y="459" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b71" font-weight="normal" text-anchor="start">jpkg-conventions.gradle</text><line x1="374" y1="300" x2="420" y2="300" stroke="#1565c0" stroke-width="1.6" marker-end="url(#arr)"/><text x="399.0" y="290" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1565c0" font-weight="normal" text-anchor="middle">fat jars</text><line x1="790" y1="300" x2="836" y2="300" stroke="#1565c0" stroke-width="1.6" marker-end="url(#arr)"/><text x="815.0" y="290" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1565c0" font-weight="normal" text-anchor="middle">files + task deps</text><rect x="24" y="536" width="1152" height="122" rx="8" fill="#f2fbf4" stroke="#2e7d32" stroke-width="1.2"/><text x="36" y="558" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#2e7d32" font-weight="bold" text-anchor="start">Result</text><text x="36" y="582" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e282c" font-weight="normal" text-anchor="start">Identical distribution for ./gradlew installDist, :installDist and clean installDist - with and without the</text><text x="36" y="601" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e282c" font-weight="normal" text-anchor="start">configuration cache, with configure-on-demand enabled. A leaf project without the module plugin now fails</text><text x="36" y="620" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e282c" font-weight="normal" text-anchor="start">loudly at resolution instead of silently shipping nothing. Removed: dead eager 'moduleLibs' block.</text><circle cx="30" cy="672.2" r="5.6" fill="none" stroke="#5f6b71" stroke-width="1.1"/><path d="M 27.2,670.5 A 3.3 3.3 0 1 1 27.2,673.9000000000001" fill="none" stroke="#5f6b71" stroke-width="1.2" stroke-linecap="round"/><text x="42" y="676" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b71" font-weight="normal" text-anchor="start">2026  -  OmegaT - Computer Assisted Translation (CAT) tool  -  This file is part of OmegaT, released under the GNU General Public License v3 or later</text><text x="42" y="691" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5f6b71" font-weight="normal" text-anchor="start">OmegaT is distributed WITHOUT ANY WARRANTY, without even the implied warranty of MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE - see the GNU General Public License for more details.</text></svg>
