<html>
<head>
   <META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">
   <title>OmegaT User Manual</title>
   <style type="text/css">
        h1 {
            width: 20%;
            text-align: center;
        }
        table {
            min-width: 20%;
        }
        tr {
            text-align: center;
        }
        .lang {
            text-align: left;
        }
        td {
            padding: 2px;
        }

   </style>
</head>
<body dir="ltr">

<h1>OmegaT User Manual</h1>

<table>
    <thead>
    <tr><td>Language Name</td></tr>
    </thead>
    <tbody>
        <% languages.each { lang -> %>
            <tr>
                <td>
                    <p class="lang"><a href="${lang.code}/index.html">${lang.name}</a></p>
                </td>
            </tr>
        <% } %>
    </tbody>
</table>

</body>

</html>
