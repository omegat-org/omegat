<h3 class="title">Een woord in het woordenboek negeren</h3>
<p>Als u woorden uit potentiële overeenkomsten van woordenboeken wilt verwijderen, voeg dan een bestand <code class="filename">ignore.txt</code>, gecodeerd in UTF-8, toe aan de map. Het bestand moet één woord per regel hebben. OmegaT zal alle woorden, die in die lijst zijn opgenomen, negeren.</p>
