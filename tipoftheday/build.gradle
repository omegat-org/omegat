/**
 * "Tip Of The Day" feature
 */

plugins {
    id 'org.omegat.module'
}

def providedCoreLibsDir = omegatModule.providedCoreLibsDir

dependencies {
    compileOnly(project(':'))
    if (file(providedCoreLibsDir).directory) {
        compileOnly omegatModule.providedCoreLib('jackson', 'jspecify')
        implementation omegatModule.providedModuleLib('tipoftheday', 'cssbox', 'jstyleparser')
    } else {
        implementation(libs.tipoftheday)
        compileOnly(libs.jspecify)
        compileOnly(libs.jackson.yaml)
    }
}
jar.dependsOn rootProject.tasks.named("tipsHtmls")